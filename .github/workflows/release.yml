name: Release

# Push a tag like v0.1.0 to build the downloads and publish a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Test
        run: go test ./...
      - name: Build
        run: make build-all VERSION="$GITHUB_REF_NAME"
      - name: Checksums
        run: cd dist && sha256sum wiferry-* > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/wiferry-* dist/SHA256SUMS.txt \
            --title "WiFerry $GITHUB_REF_NAME" \
            --notes "Download the file for your PC:

          - **Windows:** \`wiferry-windows-amd64.exe\`
          - **Linux:** \`wiferry-linux-amd64\` (or \`wiferry-linux-arm64\` for ARM / Raspberry Pi)

          Double-click it, then click **Add shortcut** on the page that opens. See the README for iPhone tips."
